<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AceIce | 祈蘭 — 入口</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A6%96%3C/text%3E%3C/svg%3E" />
<meta name="description" content="AceIce | 祈蘭 的个人主页入口页，点中间按钮进入主页。">
<style>
  /* ============================================================
   * 简略版首页：只放头像、名字、状态和一个「进入主页」按钮
   * 主页是 home.html，点按钮就跳过去
   * 白天 / 黑夜跟随主页里设置过的主题（localStorage 里的 dino-theme）
   * ============================================================ */
  :root {
    --bg: #f4f4f1;
    --card: #ffffff;
    --ink: #1f1f1f;
    --muted: #8f8f8f;
    --line: #cfcfcf;
  }
  body.night {
    --bg: #1a1a1a;
    --card: #262626;
    --ink: #e9e9e9;
    --muted: #9a9a9a;
    --line: #5a5a5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 32px 24px;
    background: var(--bg);
    color: var(--ink);
    text-align: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    transition: background 0.4s ease, color 0.4s ease;
    overflow: hidden;
  }

  /* 背景：一条很低调的地平线 + 会飘的云 */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .cloud {
    position: absolute;
    width: 68px; height: 22px;
    background: var(--line);
    border-radius: 999px;
    opacity: 0.35;
    animation: drift 60s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 26px; height: 26px; top: -12px; left: 12px; }
  .cloud::after  { width: 18px; height: 18px; top: -8px;  left: 38px; }
  @keyframes drift {
    from { transform: translateX(-20vw); }
    to   { transform: translateX(115vw); }
  }
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 2px;
    background: var(--line); opacity: 0.8; z-index: 0;
  }

  .card-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: enter 0.8s cubic-bezier(0.2, 0.75, 0.3, 1);
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  .avatar {
    width: 120px; height: 120px;
    border: 3px solid var(--ink);
    border-radius: 50%;
    overflow: hidden;
    background: var(--card);
    margin-bottom: 22px;
    animation: bob 4s ease-in-out infinite;
  }
  .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    letter-spacing: 2px;
  }
  .tagline {
    margin: 0 0 22px;
    min-height: 27px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--muted);
    letter-spacing: 1px;
  }
  /* 打字机的光标 */
  .caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 2px;
    background: var(--muted);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* 在线 / 离线小框（和主页那个同款） */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 30px;
    padding: 8px 18px;
    border: 2px dashed var(--line);
    border-radius: 999px;
    background: var(--card);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--muted);
  }
  .status-dot.online {
    background: #2ecc71;
    box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.25);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .status-dot.offline { background: #e74c3c; box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.22); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.25); }
    50%      { box-shadow: 0 0 0 6px rgba(46, 204, 113, 0.10); }
  }

  /* 中间那个「进入主页」按钮 */
  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 42px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    animation: breathe 3s ease-in-out infinite;
  }
  .enter-btn:hover,
  .enter-btn:focus-visible {
    background: var(--card);
    color: var(--ink);
    transform: translateY(-3px) scale(1.03);
  }
  .enter-btn:active { transform: translateY(0) scale(0.98); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(127, 127, 127, 0.35); }
    50%      { box-shadow: 0 0 0 12px rgba(127, 127, 127, 0); }
  }
  .hint {
    margin: 26px 0 0;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
  }

  /* ---------- 轻量粒子：漂浮星光 + 点击爆发 ---------- */
  .glow {
    position: fixed;
    z-index: 0;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.25;
    pointer-events: none;
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) scale(1); opacity: 0; }
    15%  { opacity: 0.3; }
    85%  { opacity: 0.2; }
    to   { transform: translateY(-90vh) scale(0.5); opacity: 0; }
  }
  /* 点击粒子：参数和大主页完全一致（12 颗 / 18~34px / 飞散 64px / 放大到 1.6 倍） */
  .spark {
    position: fixed;
    z-index: 9;
    pointer-events: none;
    font-size: 22px;
    line-height: 1;
    color: var(--ink);
    /* 加一点光晕，让星星在白底 / 黑底上都看得清 */
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.18), 0 0 14px currentColor;
    will-change: transform, opacity;
    animation: spark-fly 1s cubic-bezier(0.1, 0.7, 0.4, 1) forwards;
  }
  @keyframes spark-fly {
    from { opacity: 1; transform: translate(-50%, -50%) scale(0.55) rotate(0deg); }
    60%  { opacity: 1; }
    to   { opacity: 0; transform: translate(-50%, -50%) translate(var(--sx, 0px), var(--sy, -34px)) scale(1.6) rotate(var(--sr, 0deg)); }
  }
  /* 点一下按钮，整页轻轻"弹"一下 */
  .card-wrap.pop { animation: pop 0.5s ease; }
  @keyframes pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(0.975); }
    70%  { transform: scale(1.012); }
    100% { transform: scale(1); }
  }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .avatar { width: 100px; height: 100px; }
    .enter-btn { padding: 14px 32px; font-size: 15px; letter-spacing: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .avatar, .enter-btn, .card-wrap { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- 背景装饰：两朵云 + 一条地平线 -->
  <div class="sky" aria-hidden="true">
    <div class="cloud" style="top: 16%; animation-duration: 62s;"></div>
    <div class="cloud" style="top: 34%; animation-duration: 95s; animation-delay: -40s; opacity: 0.22;"></div>
  </div>
  <div class="ground" aria-hidden="true"></div>

  <main class="card-wrap">
    <div class="avatar">
      <img src="avatar.png" alt="AceIce | 祈蘭 的头像">
    </div>

    <h1>AceIce | 祈蘭</h1>
    <p class="tagline"><span id="typed"></span><span class="caret" aria-hidden="true"></span></p>

    <div class="status-pill" title="网络状态">
      <span class="status-dot online" id="status-dot"></span>
      <span id="status-text">在线</span>
    </div>

    <!-- 点它就进主页 -->
    <a class="enter-btn" href="home.html">
      <span>进入主页</span>
      <span aria-hidden="true">→</span>
    </a>

    <p class="hint">点击这里了解更多！</p>
  </main>

<script>
/* 跟随主页里选过的主题：白天 / 黑夜 */
try {
  if (localStorage.getItem("dino-theme") === "night") document.body.classList.add("night");
} catch (e) { }

/* 在线 / 离线：绿灯 / 红灯 */
try {
  (function () {
    var dot = document.getElementById("status-dot");
    var txt = document.getElementById("status-text");
    if (!dot || !txt) return;
    function refresh() {
      var online = navigator.onLine !== false;
      dot.className = "status-dot " + (online ? "online" : "offline");
      txt.textContent = online ? "在线" : "离线";
    }
    refresh();
    window.addEventListener("online", refresh);
    window.addEventListener("offline", refresh);
  })();
} catch (e) { }

/* ---------- 动效：打字机 + 漂浮星光 + 点击爆发 ----------
 * 想换打字机的句子，改下面的 LINES
 * 想换点击特效的符号，改下面的 CHARS
 */
try {
  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---- 打字机：一句话一个字一个字打出来，打完停一下擦掉换下一句 ---- */
    var LINES = [
      "在读大学生 · 昼伏夜出爱好者",
      "爱折腾一些感兴趣的小东西",
      "欢迎来我的主页逛逛 ✦"
    ];
    var out = document.getElementById("typed");
    if (out) {
      if (reduce) {
        out.textContent = LINES[0];
      } else {
        var li = 0, ci = 0, deleting = false;
        (function tick() {
          var line = LINES[li];
          out.textContent = line.slice(0, ci);
          var wait = deleting ? 40 : 95;
          if (!deleting) {
            if (ci < line.length) { ci++; }
            else { deleting = true; wait = 1500; }          /* 打完停一下 */
          } else {
            if (ci > 0) { ci--; }
            else { deleting = false; li = (li + 1) % LINES.length; wait = 320; }
          }
          setTimeout(tick, wait);
        })();
      }
    }

    /* ---- 点击 / 拖动的小星星 ---- */
    var CHARS = ["✦", "✧", "·", "✳", "⋆"];
    var lastSpawn = 0;
    function burst(x, y, count, spread) {
      if (reduce) return;
      count = count || 12; spread = spread || 64;
      for (var i = 0; i < count; i++) {
        var s = document.createElement("span");
        s.className = "spark";
        s.textContent = CHARS[i % CHARS.length];
        var ang = (Math.PI * 2 * i) / count + Math.random() * 0.7;
        var dist = spread * (0.6 + Math.random() * 0.9);
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.setProperty("--sx", Math.round(Math.cos(ang) * dist) + "px");
        s.style.setProperty("--sy", Math.round(Math.sin(ang) * dist) + "px");
        s.style.setProperty("--sr", Math.round((Math.random() - 0.5) * 260) + "deg");
        s.style.fontSize = (18 + Math.random() * 16).toFixed(1) + "px";
        s.style.opacity = (0.85 + Math.random() * 0.15).toFixed(2);
        document.body.appendChild(s);
        (function (node) {
          setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 1100);
        })(s);
      }
    }
    document.addEventListener("click", function (e) {
      /* 和大主页一样：12 颗、飞散 64px */
      burst(e.clientX, e.clientY, 12, 64);
      var wrap = document.querySelector(".card-wrap");
      if (wrap && !reduce) {
        wrap.classList.remove("pop");
        void wrap.offsetWidth;      /* 重排一下让动画能重复播放 */
        wrap.classList.add("pop");
      }
    });
    document.addEventListener("pointermove", function (e) {
      if (e.pointerType === "mouse" && e.buttons !== 1) return;
      if (e.pointerType !== "mouse" && e.pressure === 0) return;
      var now = Date.now();
      if (now - lastSpawn < 85) return;
      lastSpawn = now;
      burst(e.clientX, e.clientY, 1, 22);
    }, { passive: true });

    /* ---- 漂浮星光：慢慢往上飘的小点，给首屏一点生气 ---- */
    if (!reduce) {
      var n = 14;
      for (var i = 0; i < n; i++) {
        var g = document.createElement("span");
        g.className = "glow";
        g.style.left = (Math.random() * 100).toFixed(2) + "vw";
        g.style.top = (70 + Math.random() * 30).toFixed(2) + "vh";
        g.style.animationDuration = (11 + Math.random() * 12).toFixed(1) + "s";
        g.style.animationDelay = (-Math.random() * 20).toFixed(1) + "s";
        g.style.width = g.style.height = (2 + Math.random() * 4).toFixed(1) + "px";
        document.body.appendChild(g);
      }
    }
  })();
} catch (e) { /* 动效异常忽略，按钮照常能点 */ }
</script>
</body>
</html>
